<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Current Signins</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #CBD1DD;
            color: #333;
        }

        /* Banner */
        .banner {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 30px;
            background-color: #00224b;
            color: white;
        }

        .banner img {
            height: 50px;
        }

        .banner h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        /* Page content */
        .container {
            padding: 30px;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
        }

        th {
            background-color: #EFEFF3;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }

        tr {
            border-bottom: 1px solid #e5e7eb;
        }

        tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

<!-- Banner with logo -->
<div class="banner">
    <!-- Replace src with your logo path -->
    <img src="{{ url_for('static', filename='logo-banner.png') }}" alt="Logo">
    <h1>Currently Signed In</h1>
</div>

<div class="container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Company</th>
                <th>Email</th>
                <th>Sign In Time</th>
            </tr>
        </thead>
        <tbody>
            {% for x in signedIn %}
                <tr>
                    {% for i in x %}
                        <td>{{ x[i] }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
